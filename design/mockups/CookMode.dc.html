<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Lexend:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; background: #241A1C; }
    a { color: #F0A78A; } a:hover { color: #D9607E; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #241A1C; color: #FBF1F0; font-family: Lexend, system-ui, sans-serif; font-size: 15px; line-height: 1.45; padding: 20px 18px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px;">

  <div style="display: flex; justify-content: space-between; align-items: center;">
    <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: #A99A9D;">Bước 4 / 6</span>
    <div style="width: 44px; height: 44px; border-radius: 22px; background: #332528; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FBF1F0" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></div>
  </div>

  <div style="display: flex; gap: 6px;">
    <div style="flex-grow: 1; height: 5px; border-radius: 3px; background: #4E9E86;"></div>
    <div style="flex-grow: 1; height: 5px; border-radius: 3px; background: #4E9E86;"></div>
    <div style="flex-grow: 1; height: 5px; border-radius: 3px; background: #4E9E86;"></div>
    <div style="flex-grow: 1; height: 5px; border-radius: 3px; background: #D9607E;"></div>
    <div style="flex-grow: 1; height: 5px; border-radius: 3px; background: #433336;"></div>
    <div style="flex-grow: 1; height: 5px; border-radius: 3px; background: #433336;"></div>
  </div>

  <p style="margin: 0; font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: 27px; line-height: 1.25; text-wrap: pretty;">Đổ khuôn 20 cm, rải trứng muối lên mặt rồi nướng.</p>

  <div style="display: flex; align-items: center; justify-content: center; padding: 4px 0;">
    <div style="position: relative; width: 240px; height: 240px;">
      <svg width="240" height="240" viewBox="0 0 240 240" style="display: block;">
        <circle cx="120" cy="120" r="108" fill="none" stroke="#3A2B2E" stroke-width="14"></circle>
        <circle cx="120" cy="120" r="108" fill="none" stroke="#D9607E" stroke-width="14" stroke-linecap="round" stroke-dasharray="679" stroke-dashoffset="482" transform="rotate(-90 120 120)"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
        <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 52px; font-weight: 500; letter-spacing: -0.02em;">31:47</span>
        <span style="font-size: 13px; color: #A99A9D;">còn lại · 150°C</span>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <div style="height: 48px; border-radius: 999px; background: #332528; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500;"><svg width="16" height="16" viewBox="0 0 24 24" fill="#FBF1F0"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>Tạm dừng</div>
    <div style="height: 48px; border-radius: 999px; background: #332528; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FBF1F0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 1 2.5 5.8"></path><path d="M4 7v5h5"></path></svg>Đặt lại</div>
  </div>

  <div style="background: #332528; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 12px; color: #A99A9D;">Nguyên liệu dùng ở bước này</span>
    <div style="display: flex; justify-content: space-between;"><span>lòng đỏ trứng muối</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; color: #FBF1F0;">6 cái</span></div>
    <div style="display: flex; justify-content: space-between;"><span>hỗn hợp bột</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; color: #A99A9D;">từ bước 3</span></div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px;">
    <div style="height: 60px; border-radius: 999px; border: 2px solid #4A383B; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FBF1F0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></div>
    <div style="height: 60px; border-radius: 999px; background: #4E9E86; color: #0F1A16; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800; font-size: 20px;">Bước tiếp theo<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F1A16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></div>
  </div>

  <span style="text-align: center; font-size: 12px; color: #7E7073;">Màn hình luôn sáng khi đang nấu</span>
</div>
</x-dc>
</body>
</html>
